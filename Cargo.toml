[package]
name = "valkyrie-studio"
version = "0.3.0-alpha.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Rust avatar studio with Purism Core model runtime"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
getrandom = "0.2.17"
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "metal", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac"] }
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
cc = "1.4.5"

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[[bin]]
name = "valkyrie-agent"
path = "src/bin/agent.rs"

[[bin]]
name = "valkyrie-studio"
path = "src/bin/studio.rs"

[[bin]]
name = "valkyrie-perform"
path = "src/bin/perform.rs"
