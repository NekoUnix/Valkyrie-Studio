name: Rust builds
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'vaelari/**']
    tags: ['v0.3.*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Test and build
        shell: pwsh
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package
        shell: pwsh
        run: ./scripts/package-rust.ps1 -Label windows-x86_64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macos-arm64
          - runner: macos-15-intel
            label: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package
        run: bash scripts/package-rust.sh "${{ matrix.label }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.label }}
          path: dist/*.tar.gz
          if-no-files-found: error

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libvulkan-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Package
        run: bash scripts/package-rust.sh ubuntu-x86_64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ubuntu-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: System libraries and Rust installer
        run: |
          dnf install -y git curl tar gzip gcc clang make pkgconf-pkg-config alsa-lib-devel libX11-devel libxkbcommon-devel wayland-devel libXrandr-devel libXi-devel libXcursor-devel libXinerama-devel mesa-libGL-devel vulkan-loader-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
      - uses: actions/checkout@v7.0.1
      - name: Test, build and package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked
          cargo build --release --locked
          bash scripts/package-rust.sh fedora-x86_64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fedora-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: System libraries and Rust installer
        run: |
          pacman -Syu --noconfirm git curl tar gzip base-devel clang pkgconf alsa-lib libx11 libxkbcommon wayland libxrandr libxi libxcursor libxinerama mesa vulkan-headers vulkan-icd-loader
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
      - uses: actions/checkout@v7.0.1
      - name: Test, build and package
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked
          cargo build --release --locked
          bash scripts/package-rust.sh arch-x86_64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: arch-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v0.3.')
    needs: [windows, macos, ubuntu, fedora, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish alpha release after every build succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --notes-file "$notes" --title "Valkyrie Studio $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --title "Valkyrie Studio $GITHUB_REF_NAME"
          fi
